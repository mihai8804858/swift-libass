name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: brew install swiftlint

      - name: Run SwiftLint
        run: make lint

  spell:
    name: Spell
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install tools
        run: npm install -g git+https://github.com/streetsidesoftware/cspell-cli

      - name: Run CSpell
        run: make spell

  build-spm:
    name: Build (SPM, ${{ matrix.runner }}, ${{ matrix.config }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: ['macos-26', 'xcode-27']
        config: ['debug', 'release']
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build in ${{ matrix.config }}
        run: swift build -c ${{ matrix.config }}

  build-xcode:
    name: Build (Xcode, ${{ matrix.runner }}, ${{ matrix.config }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: ['macos-26', 'xcode-27']
        config: ['debug', 'release']
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: gem install xcpretty

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build platforms in ${{ matrix.config }}
        run: make CONFIG=${{ matrix.config }} build-all-platforms

  test-spm:
    name: Test (SPM, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: ['macos-26', 'xcode-27']
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run tests
        run: swift test

  test-xcode:
    name: Test (Xcode, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: ['macos-26', 'xcode-27']
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: gem install xcpretty

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run tests
        run: make CONFIG=debug test-all-platforms
